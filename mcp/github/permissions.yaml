# Permissions MCP GitHub (appliquées seulement si le serveur est activé).
schema: local-ai/mcp-permissions/v1
server: github
default: deny
allow_when_enabled:
  - repos.read
  - issues.read
  - pull_requests.read
ask:
  - issues.write
  - pull_requests.comment
deny:
  - repos.delete
  - push
  - admin
agents_allowed:
  - architect
  - reviewer
  - security
  - developer
  - devops
