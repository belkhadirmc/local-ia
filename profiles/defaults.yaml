# Profils par défaut : état SOUHAITÉ vs état RÉELLEMENT APPLIQUÉ. Aucun changement WSL2 effectué en 3.B.1.
schema: local-ai/profile-defaults/v1
desired:
  performance: B
  network: N1
  security: S2
  backup: BK1
applied:
  performance:
    profile: B
    status: applied
    source: "%USERPROFILE%\\.wslconfig + config/ollama/ollama.env"
    verified: "2026-11-26 (12.B.1, local-ai.ps1 profile apply B vérifié)"
    management: "local-ai.ps1 profile list|show|apply <A|B|C> --confirm (BK1, vérification, rollback)"
    measured:
      cpus: 16
      memory_gib: 23.47
      swap_gib: 8
    ollama_tuning: "num_thread auto (= 8 avec 16 vCPU), num_batch 512, Flash Attention auto, KV q8_0, contexte 8192, keep_alive 5m, Vulkan 0"
    throughput: "qwen3.5:4b 8,51 t/s (+22 %), qwen3-coder:30b 8,65 t/s (+7 %) — ADR-0012"
  network:
    profile: N1
    status: applied
    verified: "2026-11-26 (actions 4.B.1, 7.B.1)"
    detail: "ollama sur local-ai-core (interne), aucun port publié ; opencode : 127.0.0.1:4096 uniquement, sans route par défaut (sortie Internet vérifiée bloquée, R1)"
  security:
    profile: S2
    status: applied
    reason: "agents OpenCode déployés avec permissions des définitions (base deny, ask pour edit/shell, délégations à valider) ; refus techniques prioritaires et anti-chaînage (10.B.1) ; durcissement conteneur ollama + opencode"
    management: "local-ai.ps1 permissions list|check|grant|revoke|reset|profile ; autorisations persistantes config/security/grants.yaml"
    emergency_stop: "local-ai.ps1 emergency-stop [status|clear]"
    audit_log: runtime/logs/audit.jsonl
    container_hardening: "uid 1000, cap_drop ALL, seccomp, no-new-privileges, racine en lecture seule"
  backup:
    profile: BK1
    status: applied
    restore_points:
      - 2.B.1_20261125_164110
      - 2.B.3_20261125_164653
      - 2.B.3.1_20261125_165143
modules:
  ollama:
    status: running
    image: "ollama/ollama:0.40.18@sha256:4e0d5daa6c5cd91e27011977031466844c5ea4ba2393b35e78068835edec040b"
    platform: linux/amd64
    volume: local-ai-ollama
    models_loaded: 0
    models_available: 7
    models_size_gib: 52.98
    models_tested_offline: "7/7 PASS (5.B.1)"
    verified: "2026-11-25 (actions 4.B.1, 5.B.1)"
    network: "local-ai-inference (interne) uniquement depuis 14.B.1 ; joint par la passerelle seule"
  inference_gate:
    status: running
    service: ollama-gate
    script: config/gate/gate.pl
    role: "seul accès à Ollama (Web, TUI, agents, Continue) : JSON strict, modèles du registre, routes d'administration refusées, verrou d'inférence unique, garde RAM avant/pendant (Windows >= 4 Gio projetés, sentinelle hôte), arrêt d'urgence"
    sentinel: "scripts/monitor/sentinel.ps1 (runtime/state/host-ram.json, toutes les 2 s, démarrée par start)"
    verified: "2026-11-26 (14.B.1 : passerelle 15/15, Continue 7/7, JSON 21/21, 30B/20B refusés, 14B admis)"
  agent_fallback:
    status: active
    policy: config/agents/fallback.yaml   # -> config/gate/fallback.json
    rule: "repli par TÂCHE (modèle de session), affectations initiales conservées ; auto avant exécution, confirmation après démarrage, jamais de rejeu ni de contournement de la garde RAM"
    chains: "20B/30B/14B -> qwen3.5:9b -> qwen3.5:4b ; qa 7B -> 4B ; documentalist 9B -> 4B ; security 20B -> 9B (ask) ; assistant/autocomplete off"
    web_tui: "repli manuel assisté (refus explicite + proposition de la passerelle) — limite OpenCode 2.3.2, R33"
    log: runtime/logs/fallback.jsonl
    verified: "2026-11-26 (14.B.2 : seuils simulés, auto réel affiché = utilisé, abandon après démarrage sans rejeu)"
  tools:
    status: installed
    volume: local-ai-tools (lecture seule)
    components: "python3 3.14.10-r2, git 2.54.1-r0 (Alpine 3.24, 34 paquets, config/tools/lock.txt)"
    mounts: "OpenCode (PATH du shell des agents), modèle Dev Container (nouveaux projets)"
    build: "aucune (R3 non sollicité)"
    verified: "2026-11-26 (14.B.2, tools verify)"
  opencode:
    status: running
    image: "ghcr.io/anomalyco/opencode:2.3.2@sha256:43d4d0fb1d94fed8db615f865df7661104a39af6ca94dad631c09844b5e3ff22"
    platform: linux/amd64
    volume: local-ai-opencode
    access: "http://127.0.0.1:4096 (Basic, secrets/opencode.env) ; terminal : local-ai.ps1 tui"
    provider: "ollama interne uniquement, 7 modèles, contexte 8192 max"
    agents: "9 (affectations INITIALES conservées, agents/assignments.initial.yaml ; opérationnels par repli local contrôlé, 14.B.2 — R5 acceptable)"
    clients: "Web et TUI ; Desktop Windows bloqué (serveur autonome imposé, ADR-0008)"
    delegation: "MANUELLE (14.B.1, delegation_mode: manual) : aucune règle subagent ; transfert par local-ai.ps1 agent handoff <agent> \"<consigne>\" (ADR-0014)"
    agent_shell: "/etc/local-ai/agent-shell (sans OPENCODE_PASSWORD, R14)"
    builtin_agents_disabled: [build, plan, general, explore]
    networks: [local-ai-core, local-ai-localhost, local-ai-mcp-relay]
    verified: "2026-11-26 (actions 7.B.1, 8.B.1, 9.B.1, 10.B.1)"
  mcp:
    status: prepared
    enabled: 0
    servers: [github, gitlab, jira, confluence]
    architecture: "N4 implémentée (relais isolés, sortie filtrée par destination, lecture seule) — ADR-0010"
    activation: "sur accord : jeton lecture seule de l'utilisateur dans secrets/mcp-<id>.env puis mcp enable <id> --authorize-n4"
    images: ["ubuntu/squid:6.6-24.04_edge@sha256:d588976774988e439af518940316004280dec80772c19af1cc33ae39afa5d2eb", "ghcr.io/github/github-mcp-server:v2.3.0@sha256:110ce018ce2a559b3d552673e675806ad9c2abbc1749360d41289ea415c67926"]
    verified: "2026-11-26 (10.B.1, GitHub en témoin local ; aucune connexion externe)"
  continue:
    status: installed_disabled
    extension: "Continue.continue@2.0.0"
    model: qwen2.5-coder:1.5b
    relay: "127.0.0.1:11435 (arrêté par défaut ; local-ai.ps1 continue on|off)"
    telemetry: false
    indexing: false
    pinned: true
    verified: "2026-11-26 (11.B.1 API du relais ; autocomplétion et Tab validés manuellement par l'utilisateur)"
  projects:
    status: ready
    extension: "ms-vscode-remote.remote-containers@0.481.0 (pinned)"
    image: "mcr.microsoft.com/devcontainers/base:3.0.14-noble@sha256:6d5b4ab2e68690be81f114a096f147fd95f0230910bcd17421e84459e5a17e1a"
    active: none
    sharing: "seul le projet ouvert est monté dans OpenCode (/data/workspace/<id>)"
    verified: "2026-11-26 (11.B.1 ; projet demo Ubuntu 24.04.5 non-root ouvert manuellement dans VS Code par l'utilisateur)"
  cloud:
    status: deferred_post_v1
    implemented: false
    decision: "ADR-0013 : V1 100 % locale (fournisseur OpenCode ollama seul, provider.use refusé ailleurs, OLLAMA_NO_CLOUD=1, aucun repli) ; N3 conservé comme point d'extension"
    guard: "local-ai.ps1 config : contrôle « V1 locale (aucun cloud) »"
    verified: "2026-11-26 (13.B.1, sans inférence)"
  vscode:
    terminal_profile: "OpenCode (local-ai) — TUI avec TMPDIR=/tui-tmp (tmpfs exécutable dédié, 11.B.2), validé manuellement dans VS Code"
    web: "http://127.0.0.1:4096"
monitoring: "local-ai.ps1 monitor status|watch ; historique runtime/monitor (7 j), audit 30 j ; seuils config/monitoring/thresholds.yaml"
note: "État appliqué : performance gérée par local-ai.ps1 profile (12.B.1) ; autres sections renseignées manuellement."
