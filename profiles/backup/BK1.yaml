# Profil de sauvegarde BK1.
schema: local-ai/profile/backup/v1
id: BK1
name: configuration
scope:
  - "%USERPROFILE%\\.wslconfig"
  - "%USERPROFILE%\\.docker\\daemon.json"
  - "%USERPROFILE%\\.docker\\config.json"
  - "%APPDATA%\\Docker\\settings-store.json"
  - config/
  - profiles/
  - compose/
destination: backups/restore-points
integrity: "sha256 (SHA256SUMS.txt + manifest)"
secrets: "jamais copiés en clair"
quota_local_gib: 10
automatic_deletion_of_critical: false
