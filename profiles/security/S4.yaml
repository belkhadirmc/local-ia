# Profil de sécurité S4.
schema: local-ai/profile/security/v1
id: S4
name: custom
description: "Personnalisé : hérite de S1, surcharges explicites dans profiles/custom/."
permissions:
  read: allow
  edit: ask
  bash: ask
  network: deny
  mcp: deny
  delegation: ask
always_ask:
  - "suppression de fichiers"
  - "git push"
  - "commandes hors workspace"
  - "modification de secrets/"
always_deny:
  - "socket Docker"
  - "conteneur privileged"
  - "network_mode host"
  - "montage global Windows"
inherits: S1
overrides_dir: profiles/custom
