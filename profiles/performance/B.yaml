# Profil de performance B — état SOUHAITÉ (non appliqué automatiquement).
schema: local-ai/profile/performance/v1
id: B
wsl2:
  memory: 24GB
  processors: 8
  swap: 8GB
  autoMemoryReclaim: gradual
ollama:
  OLLAMA_CONTEXT_LENGTH: 8192
  OLLAMA_NUM_PARALLEL: 1
  OLLAMA_MAX_LOADED_MODELS: 1
limits:
  concurrent_inferences: 1
  loaded_models: 1
wslconfig_preview: |-
  [wsl2]
  memory=24GB
  processors=8
  swap=8GB

  [experimental]
  autoMemoryReclaim=gradual
apply:
  automatic: false
  requires:
    - "arrêt Docker Desktop"
    - "wsl --shutdown"
    - "sauvegarde BK1"
