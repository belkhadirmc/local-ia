# Profil de performance A — état SOUHAITÉ (non appliqué automatiquement).
schema: local-ai/profile/performance/v1
id: A
wsl2:
  memory: 12GB
  processors: 4
  swap: 4GB
  autoMemoryReclaim: gradual
ollama:
  OLLAMA_CONTEXT_LENGTH: 4096
  OLLAMA_NUM_PARALLEL: 1
  OLLAMA_MAX_LOADED_MODELS: 1
limits:
  concurrent_inferences: 1
  loaded_models: 1
wslconfig_preview: |-
  [wsl2]
  memory=12GB
  processors=4
  swap=4GB

  [experimental]
  autoMemoryReclaim=gradual
apply:
  automatic: false
  requires:
    - "arrêt Docker Desktop"
    - "wsl --shutdown"
    - "sauvegarde BK1"
