# Profil de performance A — Économe. Appliqué par .\local-ai.ps1 profile apply A --confirm (BK1, vérification, rollback).
schema: local-ai/profile/performance/v2
id: A
label: "Économe"
status: defined
wsl2:
  memory: 12GB
  processors: 8
  swap: 4GB
  autoMemoryReclaim: gradual
ollama:
  OLLAMA_CONTEXT_LENGTH: 4096
  OLLAMA_KEEP_ALIVE: 2m
  OLLAMA_KV_CACHE_TYPE: q8_0
  OLLAMA_NUM_PARALLEL: 1
  OLLAMA_MAX_LOADED_MODELS: 1
  num_thread: auto
limits:
  concurrent_inferences: 1
  loaded_models: 1
  max_model_gib: 7
note: "Modèles <= 9b seulement (qwen3.5:4b/9b, qwen2.5-coder:1.5b/7b) ; contexte 4096. Non mesuré en 12.B.1."
