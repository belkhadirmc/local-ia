# SURCHARGE SUR AUTORISATION — réseau local-ai-cloud : IA cloud manuelle, par session.
# Profil réseau requis : N3. Usage : docker compose -f compose.yaml -f compose/overrides/cloud.yaml ...
# Un service n'obtient ce réseau que s'il le déclare explicitement dans une surcharge dédiée.
networks:
  local-ai-cloud:
    name: local-ai-cloud
    driver: bridge
    internal: false
    labels:
      local-ai.network: cloud
      local-ai.authorization: required
      local-ai.profile: N3
