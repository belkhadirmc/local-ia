# SURCHARGE — exposition de ollama sur 127.0.0.1:11434 uniquement (si nécessaire).
# Un réseau interne ne permet pas la publication de ports : un pont dédié sans NAT sortant
# (enable_ip_masquerade=false) est utilisé. Comportement à tester lors du déploiement.
services:
  ollama:
    networks: [local-ai-core, local-ai-localhost]
    ports:
      - "127.0.0.1:11434:11434"

networks:
  local-ai-localhost:
    name: local-ai-localhost
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
    labels:
      local-ai.network: localhost
      local-ai.authorization: required
