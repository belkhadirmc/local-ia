# MODÈLE INACTIF — Ollama (CPU). Activation : image épinglée (version + digest), volume
# local-ai-ollama provisionné, profil B appliqué, benchmarks. Double garde : profile "ollama"
# + référence imposée dépôt:version@sha256 (aucune image par défaut). Format du digest et
# refus de "latest" contrôlés par local-ai.ps1 config (Compose ne valide pas le format).
# Non-root : à valider avec l'image retenue (OLLAMA_MODELS + droits du volume).
services:
  ollama:
    image: ${OLLAMA_IMAGE_REPO:?OLLAMA_IMAGE_REPO requis}:${OLLAMA_IMAGE_TAG:?OLLAMA_IMAGE_TAG requis (version explicite)}@sha256:${OLLAMA_IMAGE_SHA256:?OLLAMA_IMAGE_SHA256 requis (64 hex)}
    profiles: [ollama]
    restart: "no"
    env_file:
      - path: ../../config/ollama/ollama.env
        required: true
    networks: [local-ai-core]
    volumes:
      - local-ai-ollama:/root/.ollama
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "11434"

networks:
  local-ai-core:
    name: local-ai-core
    driver: bridge
    internal: true
    labels:
      local-ai.network: core
      local-ai.authorization: none

volumes:
  local-ai-ollama:
    name: local-ai-ollama
    external: true
