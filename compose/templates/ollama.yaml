# MODULE Ollama (CPU uniquement) — ACTIVÉ en 4.B.1 via include dans compose.yaml.
# Double garde conservée : profile "ollama" + référence imposée dépôt:version@sha256 (aucune image par défaut).
# Format du digest et refus de "latest" contrôlés par local-ai.ps1 config (Compose ne valide pas le format).
# Image validée : ollama/ollama:0.40.18@sha256:4e0d5daa…040b (linux/amd64), voir .env / ADR-0004.
# Sécurité : UID/GID 1000 (utilisateur ubuntu de l'image), cap_drop ALL, Seccomp par défaut,
# no-new-privileges, racine en lecture seule, aucun port publié, réseau interne uniquement.
# Initialisation root temporaire SANS réseau (chown du volume /models), seule capacité : CHOWN.
x-ollama-logging: &ollama-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  ollama-init:
    image: ${OLLAMA_IMAGE_REPO:?OLLAMA_IMAGE_REPO requis}:${OLLAMA_IMAGE_TAG:?OLLAMA_IMAGE_TAG requis (version explicite)}@sha256:${OLLAMA_IMAGE_SHA256:?OLLAMA_IMAGE_SHA256 requis (64 hex)}
    profiles: [ollama]
    restart: "no"
    user: "0:0"
    entrypoint: ["/usr/bin/chown", "1000:1000", "/models"]
    command: []
    network_mode: none
    volumes:
      - local-ai-ollama:/models
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    logging: *ollama-logging

  ollama:
    image: ${OLLAMA_IMAGE_REPO:?OLLAMA_IMAGE_REPO requis}:${OLLAMA_IMAGE_TAG:?OLLAMA_IMAGE_TAG requis (version explicite)}@sha256:${OLLAMA_IMAGE_SHA256:?OLLAMA_IMAGE_SHA256 requis (64 hex)}
    profiles: [ollama]
    restart: "no"
    user: "1000:1000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - path: ../../config/ollama/ollama.env
        required: true
    environment:
      HOME: /tmp
      NVIDIA_VISIBLE_DEVICES: void
    # 14.B.1 : Ollama n'est plus sur local-ai-core ; seul réseau = local-ai-inference (interne), joint par la passerelle uniquement.
    networks:
      local-ai-inference:
        aliases: [ollama-engine]
    volumes:
      - local-ai-ollama:/models
    read_only: true
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *ollama-logging

  # 14.B.1 : passerelle d'inférence (config/gate/gate.pl) — seul accès à Ollama (OpenCode Web/TUI/agents, relais Continue).
  # Exclusion mutuelle des inférences, admission et surveillance RAM (R24), JSON strict (R20), routes d'administration refusées.
  ollama-gate:
    image: ${OLLAMA_IMAGE_REPO:?OLLAMA_IMAGE_REPO requis}:${OLLAMA_IMAGE_TAG:?OLLAMA_IMAGE_TAG requis (version explicite)}@sha256:${OLLAMA_IMAGE_SHA256:?OLLAMA_IMAGE_SHA256 requis (64 hex)}
    profiles: [ollama]
    restart: "no"
    user: "1000:1000"
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/usr/bin/perl", "/etc/local-ai/gate.pl"]
    command: []
    environment:
      GATE_UPSTREAM: "ollama-engine:11434"
      # Doit correspondre à models/registry.yaml (contrôlé par local-ai.ps1 config)
      GATE_MODELS: "qwen2.5-coder:1.5b,qwen3.5:4b-q4_K_M,qwen2.5-coder:7b,qwen3.5:9b-q4_K_M,qwen2.5-coder:14b,gpt-oss:20b,qwen3-coder:30b"
      GATE_WIN_MIN_GIB: "4"            # config/monitoring/thresholds.yaml windows_ram_free_min_gib (ADR-0001)
      GATE_GROWTH_FACTOR: "2"          # poids + cache de pages WSL2 (mesuré 12.B.1, R24)
      GATE_UNVERIFIED_MAX_GIB: "8"     # sans mesure Windows fraîche : modèles <= 8 Gio seulement
      GATE_HOST_STALE_S: "20"
      GATE_QUEUE_S: "900"
      GATE_ABORT_AFTER_S: "3"
      GATE_ADMIT_WAIT_S: "20"        # réévaluation avant refus non réessayable (400)
      GATE_STATE_DIR: /run/local-ai/state
    networks:
      local-ai-core:
        aliases: [ollama]
      local-ai-inference: {}
    volumes:
      - type: bind
        source: ../../config/gate/gate.pl
        target: /etc/local-ai/gate.pl
        read_only: true
      - type: bind
        source: ../../config/gate/LocalAiJson.pm
        target: /etc/local-ai/LocalAiJson.pm
        read_only: true
      - type: bind
        source: ../../runtime/state
        target: /run/local-ai/state
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=8m,uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "/usr/bin/perl", "-MIO::Socket::INET", "-e", "exit(IO::Socket::INET->new(PeerAddr => '127.0.0.1:11434', Timeout => 3) ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *ollama-logging

networks:
  local-ai-inference:
    name: local-ai-inference
    driver: bridge
    internal: true
    labels:
      local-ai.network: inference
      local-ai.authorization: none
  local-ai-core:
    name: local-ai-core
    driver: bridge
    internal: true
    labels:
      local-ai.network: core
      local-ai.authorization: none

volumes:
  local-ai-ollama:
    name: local-ai-ollama
    external: true
