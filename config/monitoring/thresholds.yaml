# Politiques de supervision VALIDÉES (ADR-0001), appliquées par local-ai.ps1 monitor status|watch (12.B.1, scripts/monitor/monitor.ps1).
schema: local-ai/monitoring/v1
disk_ssd_free_gib:
  warning: 45
  critical: 30
  emergency: 15
wsl2_ram_percent:
  warning: 85
  critical: 95
cpu_percent:
  threshold: 95
  duration_minutes: 5
windows_ram_free_min_gib: 4
