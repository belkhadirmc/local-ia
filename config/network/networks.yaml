# Catalogue des réseaux local-ai. Créés : local-ai-core (4.B.1), local-ai-localhost (7.B.1).
schema: local-ai/networks/v1
networks:
  - name: local-ai-core
    internal: true
    authorization: none
    defined_in: compose/services/core.yaml
  - name: "local-ai-project-<id>"
    internal: true
    authorization: none
    defined_in: compose/templates/project.yaml
  - name: local-ai-egress
    internal: false
    authorization: required
    profile: N2
    defined_in: compose/overrides/egress.yaml
  - name: local-ai-cloud
    internal: false
    authorization: required
    profile: N3
    defined_in: compose/overrides/cloud.yaml
    status: deferred_post_v1   # ADR-0013 : réservé, jamais attaché en V1
  - name: local-ai-mcp
    internal: false
    authorization: required
    profile: N4
    defined_in: compose/overrides/mcp.yaml
  - name: local-ai-mcp-relay
    internal: true
    authorization: none
    note: "opencode-net + relais MCP N4 uniquement (10.B.1)"
    defined_in: compose/templates/opencode.yaml
  - name: "local-ai-mcp-srv-<id>"
    internal: true
    authorization: required
    note: "relais, serveur et proxy de sortie d un MCP (projet local-ai-mcp-<id>)"
    defined_in: scripts/mcp/n4.ps1
  - name: local-ai-localhost
    internal: false
    authorization: required
    note: "publication 127.0.0.1 ; sortie Internet NON bloquée par enable_ip_masquerade=false (7.B.1, R1) : routes par défaut retirées par egress-guard (opencode)"
    defined_in: "compose/overrides/*-localhost.yaml"
ports_planned:
  - service: ollama
    port: 11434
    bind: "127.0.0.1"
  - service: opencode
    port: 4096
    bind: "127.0.0.1"
