# Agent QA — définition indépendante d'OpenCode.
schema: local-ai/agent/v1
id: qa
name: QA
role: "Écrit et exécute les tests, rapporte la couverture."
model:
  ref: qwen2.5-coder-7b
  confirmed: false
  note: "à confirmer après benchmarks"
instructions: ../prompts/qa.md
permissions:
  baseline_profile: S2
  read: allow
  edit: ask
  bash: deny
  network: deny
  mcp: ask
tools:
  - read
  - grep
  - glob
  - write
  - test
  - git-read
delegation:
  can_delegate_to: []
  max_depth: 1
mcp:
  authorizable:
    - jira
  enabled: []
opencode:
  export: "à générer depuis cette définition"
  status: not_converted
